{% extends "base.html" %}{% block title %}Patient Reports{% endblock %}{% block content %}<div class="page-content"><div class="page-header"><div><h1 class="page-title">Patient Reports</h1><p class="page-subtitle">Review reports belonging to patients who have appointments with you.</p></div></div><div class="card"><div class="card-body" id="reports-list">Loading…</div></div></div>{% endblock %}{% block extra_js %}<script>async function load(){const r=await fetch('/api/doctor/reports');const d=await r.json();const el=document.getElementById('reports-list');el.innerHTML=(d.reports||[]).map(x=>`<div class="card mb-3"><div class="card-body"><div style="display:flex;justify-content:space-between;gap:1rem"><div><h5>${x.filename}</h5><div class="text-muted">Patient: ${x.patient_name} · ${x.patient_email}</div><div class="small text-muted">Uploaded: ${x.created_at}</div></div><span class="badge-pill badge-success">${x.status}</span></div><hr><h6>AI analysis</h6><div style="white-space:pre-wrap">${(x.analysis||'No analysis').replace(/</g,'&lt;')}</div></div></div>`).join('')||'<p>No patient reports found.</p>'}load();</script>{% endblock %}
