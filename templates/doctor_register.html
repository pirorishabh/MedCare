{% extends "base.html" %}{% block title %}Doctor Registration{% endblock %}
{% block extra_css %}<style>.main-content{margin-left:0!important;padding-top:0!important}#sidebar,#topbar{display:none!important}.auth-page{min-height:100vh;background:linear-gradient(135deg,#0b1220,#123b57,#0f766e);display:flex;align-items:center;justify-content:center;padding:2rem}.auth-card{width:100%;max-width:520px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:2.5rem}.auth-input{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;color:white}.auth-label{color:rgba(255,255,255,.8);font-size:.875rem;font-weight:600;display:block;margin-bottom:.4rem}</style>{% endblock %}
{% block content %}<div class="auth-page"><div class="auth-card"><div style="text-align:center;margin-bottom:1.5rem"><div style="font-size:2.5rem">🩺</div><h2 style="color:white;font-weight:800">Create Doctor Account</h2><p style="color:rgba(255,255,255,.55)">Use your professional details</p></div><form onsubmit="doctorRegister(event)"><div class="row"><div class="col-6"><label class="auth-label">First Name</label><input id="df" class="auth-input" required></div><div class="col-6"><label class="auth-label">Last Name</label><input id="dl" class="auth-input" required></div></div><label class="auth-label" style="margin-top:1rem">Email</label><input id="de" class="auth-input" type="email" required><label class="auth-label" style="margin-top:1rem">Specialization</label><input id="ds" class="auth-input" placeholder="Cardiology, General Medicine..." required><label class="auth-label" style="margin-top:1rem">Medical License / Registration No.</label><input id="lic" class="auth-input" required><label class="auth-label" style="margin-top:1rem">Password</label><input id="dp" class="auth-input" type="password" minlength="8" required><button class="btn btn-primary w-full" style="margin-top:1.25rem;padding:.8rem">Create Doctor Account</button></form><p style="text-align:center;color:rgba(255,255,255,.55);margin-top:1.5rem"><a href="/doctor/login" style="color:#60a5fa">Back to Doctor Login</a></p></div></div>{% endblock %}
{% block extra_js %}<script>async function doctorRegister(e){e.preventDefault();const p=document.getElementById('dp').value;try{const r=await fetch('/api/auth/doctor/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({first_name:df.value,last_name:dl.value,email:de.value,password:p,specialization:ds.value,license_number:lic.value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Registration failed');Toast.success('Account created','Please sign in.');setTimeout(()=>location.href='/doctor/login',600)}catch(x){Toast.error('Registration failed',x.message)}}</script>{% endblock %}
