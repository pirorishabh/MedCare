{% extends "base.html" %}{% block title %}Appointments{% endblock %}{% block content %}<div class="page-content"><div class="page-header"><div><h1 class="page-title">Doctor Appointments</h1><p class="page-subtitle">Book a doctor, track your queue and join video consultations.</p></div></div><div class="row g-4"><div class="col-lg-5"><div class="card"><div class="card-header"><i class="fas fa-calendar-plus"></i><b>Book Appointment</b></div><div class="card-body"><form id="appt-form"><label class="form-label">Doctor</label><select id="doctor" class="form-control" required></select><label class="form-label mt-3">Reason / Title</label><input id="title" class="form-control" placeholder="Follow-up, fever, consultation..." required><label class="form-label mt-3">Date & Time</label><input id="time" type="datetime-local" class="form-control" required><label class="form-label mt-3">Notes</label><textarea id="notes" class="form-control" rows="3"></textarea><button class="btn btn-primary w-full mt-3">Request Appointment</button></form></div></div></div><div class="col-lg-7"><div class="card"><div class="card-header"><i class="fas fa-list"></i><b>My Appointments</b></div><div class="card-body" id="appts">Loading…</div></div></div></div></div>{% endblock %}{% block extra_js %}<script>
async function loadDoctors(){const r=await fetch('/api/doctors');const d=await r.json();document.getElementById('doctor').innerHTML=(d.doctors||[]).map(x=>`<option value="${x.id}">Dr. ${x.first_name} ${x.last_name} — ${x.specialization||'General Medicine'}</option>`).join('')||'<option value="">No doctors registered</option>'}
async function loadAppts(){const r=await fetch('/api/appointments');const d=await r.json();document.getElementById('appts').innerHTML=(d.appointments||[]).map(x=>`<div class="appointment-card mb-3"><div class="appt-date-block"><div class="appt-day">${new Date(x.appointment_time).getDate()}</div><div class="appt-month">${new Date(x.appointment_time).toLocaleString('en',{month:'short'})}</div></div><div class="flex-grow-1"><b>Dr. ${x.doctor_name}</b><div class="small text-muted">${x.title} · ${x.doctor_specialty||x.specialty||''}</div><div class="small text-muted">${x.appointment_time}</div></div><span class="badge-pill badge-primary">${x.status}</span>${['confirmed','in_progress'].includes(x.status)?`<a class="btn btn-sm btn-success ms-2" href="/video/${x.room_id}"><i class="fas fa-video"></i></a>`:''}${!['completed','cancelled'].includes(x.status)?`<button class="btn btn-sm btn-ghost ms-1" onclick="cancelAppt(${x.id})">Cancel</button>`:''}</div>`).join('')||'No appointments yet.'}
async function cancelAppt(id){await fetch('/api/appointments/'+id+'/cancel',{method:'POST'});loadAppts()}
document.getElementById('appt-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/appointments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({doctor_id:doctor.value,title:title.value,appointment_time:time.value,notes:notes.value})});const d=await r.json();if(!r.ok){Toast.error('Booking failed',d.message);return}Toast.success('Requested','Your appointment is now in the doctor queue.');e.target.reset();loadAppts()});loadDoctors();loadAppts();
</script>{% endblock %}
