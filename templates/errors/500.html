<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error | DoctorTalk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #3b1010 50%, #1a0f0f 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem; color: white;
    }
    .code { font-size: clamp(6rem, 20vw, 10rem); font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, #f87171, #fbbf24);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .title { font-size: 1.75rem; font-weight: 800; margin: 1rem 0 .75rem; }
    .msg { color: rgba(255,255,255,.6); max-width: 420px; margin: 0 auto 2rem; font-size: 1.05rem; }
    .btn { display: inline-flex; align-items: center; gap: .5rem;
      padding: .875rem 2rem; border-radius: 12px; font-weight: 700;
      text-decoration: none; transition: all .25s; margin: 0 .375rem; }
    .btn-home { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; }
    .btn-back { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: white; }
    .btn-home:hover, .btn-back:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <div class="code">500</div>
    <h1 class="title">Something Went Wrong</h1>
    <p class="msg">The server encountered an unexpected error. This is likely a temporary issue. Please try again shortly.</p>
    <a href="/" class="btn btn-home"><i class="fas fa-home"></i> Back to Home</a>
    <a href="javascript:history.back()" class="btn btn-back"><i class="fas fa-arrow-left"></i> Go Back</a>
  </div>
</body>
</html>
