<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | DoctorTalk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0d4a47 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem; color: white;
    }
    .code { font-size: clamp(6rem, 20vw, 10rem); font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, #60a5fa, #34d399);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .title { font-size: 1.75rem; font-weight: 800; margin: 1rem 0 .75rem; }
    .msg { color: rgba(255,255,255,.6); font-size: 1.05rem; max-width: 400px; margin: 0 auto 2rem; }
    .btn { display: inline-flex; align-items: center; gap: .5rem;
      padding: .875rem 2rem; border-radius: 12px; font-weight: 700;
      text-decoration: none; transition: all .25s; }
    .btn-home { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; }
    .btn-home:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1 class="title">Page Not Found</h1>
    <p class="msg">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn btn-home"><i class="fas fa-home"></i> Back to Home</a>
  </div>
</body>
</html>
