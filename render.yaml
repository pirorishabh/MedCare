services:
  - type: web
    name: doctortalk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: RENDER
        value: "true"
      - key: FLASK_DEBUG
        value: "false"
      - key: IBM_API_KEY
        sync: false
      - key: IBM_PROJECT_ID
        sync: false
      - key: IBM_MODEL_ID
        value: meta-llama/llama-3-3-70b-instruct
      - key: IBM_URL
        value: https://au-syd.ml.cloud.ibm.com
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
      - key: APP_NAME
        value: Doctortalk
      - key: APP_VERSION
        value: "1.0.0"
